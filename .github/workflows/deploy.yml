name: Build y Deploy MATEPONG a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame pygbag

      - name: Build con pygbag
        run: |
          python -m pygbag --build src

      - name: Copiar build a /docs
        run: |
          cp -r src/build/web/. docs/

      - name: Descargar browserfs.min.js localmente y actualizar referencia en index.html
        run: |
          curl -sL "https://pygame-web.github.io/cdn/0.9.3/browserfs.min.js" -o docs/browserfs.min.js
          sed -i 's|<script src="https://pygame-web.github.io/cdn/0.9.3/[/]*browserfs.min.js"></script>|<script src="browserfs.min.js"></script>|g' docs/index.html

      - name: Commit y push de /docs actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "deploy: actualizar build web de MATEPONG"
          git push
