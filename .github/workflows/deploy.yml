name: Build y Deploy MATEPONG a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame pygbag

      - name: Build con pygbag
        run: |
          python -m pygbag --build src

      - name: Copiar build a /docs
        run: |
          cp -r src/build/web/. docs/

      - name: Corregir bug de doble barra en URL de browserfs (pygbag 0.9.3)
        run: |
          sed -i 's|cdn/0.9.3//browserfs|cdn/0.9.3/browserfs|g' docs/index.html

      - name: Commit y push de /docs actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "deploy: actualizar build web de MATEPONG"
          git push
