name: Build y Deploy MATEPONG a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame pygbag

      - name: Build con pygbag
        run: |
          python -m pygbag --build src

      - name: Copiar build a /docs
        run: |
          cp -r src/build/web/. docs/

      - name: Descargar browserfs.min.js real (jsdelivr) y actualizar referencia en index.html
        run: |
          # El CDN de pygbag devuelve 404 para browserfs.min.js — se descarga de jsdelivr
          curl -sL "https://cdn.jsdelivr.net/npm/browserfs/dist/browserfs.min.js" -o docs/browserfs.min.js
          sed -i 's|<script src="https://pygame-web.github.io/cdn/0.9.3/[/]*browserfs.min.js"></script>|<script src="browserfs.min.js"></script>|g' docs/index.html

      - name: Añadir overlay arcade click-to-play (desbloqueo AudioContext)
        run: |
          python3 - << 'PYEOF'
          overlay = """

          <!-- OVERLAY ARCADE — desbloquea AudioContext con gesto de usuario -->
          <style>
            @keyframes neon-pulsar {
              from { opacity: 0.55; text-shadow: 0 0 10px #00ff64, 0 0 20px #00ff64; }
              to   { opacity: 1.00; text-shadow: 0 0 25px #00ff64, 0 0 50px #00ff64, 0 0 80px #00ff64; }
            }
            #play-overlay {
              position: fixed; top: 0; left: 0; right: 0; bottom: 0;
              z-index: 999998; background: #000;
              display: flex; flex-direction: column;
              align-items: center; justify-content: center;
              cursor: pointer; user-select: none;
            }
            #play-overlay .btn-play {
              font-family: "Courier New", monospace;
              font-size: clamp(28px, 5vw, 56px); font-weight: bold;
              color: #00ff64; letter-spacing: 6px;
              animation: neon-pulsar 0.9s ease-in-out infinite alternate;
            }
            #play-overlay .subtitulo {
              font-family: "Courier New", monospace;
              font-size: clamp(12px, 2vw, 18px); color: #505050;
              letter-spacing: 3px; margin-top: 28px;
            }
            #play-overlay .subtitulo span { color: #00dc8c; }
          </style>
          <div id="play-overlay" onclick="desbloquearYJugar()">
            <div class="btn-play">&#9654; CLICK TO PLAY</div>
            <div class="subtitulo">MATEPONG &middot; <span>CARGANDO...</span></div>
          </div>
          <script>
          function desbloquearYJugar() {
            try {
              var ctx = new (window.AudioContext || window.webkitAudioContext)();
              ctx.resume();
            } catch(e) {}
            document.getElementById("play-overlay").style.display = "none";
          }
          </script>"""

          path = "docs/index.html"
          with open(path, "r", encoding="utf-8") as f:
              html = f.read()
          if "<body>" in html and "play-overlay" not in html:
              html = html.replace("<body>", "<body>" + overlay, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(html)
              print("Overlay añadido")
          else:
              print("Overlay ya presente o body no encontrado")
          PYEOF

      - name: Commit y push de /docs actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "deploy: actualizar build web de MATEPONG"
          git push
