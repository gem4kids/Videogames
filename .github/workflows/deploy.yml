name: Build y Deploy MATEPONG a GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install pygame pygbag==0.9.2

      - name: Build con pygbag
        run: |
          python -m pygbag --build src

      - name: Copiar build a /docs
        run: |
          cp -r src/build/web/. docs/

      - name: Descargar browserfs.min.js real (jsdelivr) y actualizar referencia en index.html
        run: |
          # El CDN de pygbag devuelve 404 para browserfs.min.js — se descarga de jsdelivr
          curl -sL "https://cdn.jsdelivr.net/npm/browserfs/dist/browserfs.min.js" -o docs/browserfs.min.js
          # Reemplaza referencia a browserfs del CDN (con o sin doble barra) por la local
          sed -i 's|<script src="https://pygame-web.github.io/[^"]*browserfs.min.js"></script>|<script src="browserfs.min.js"></script>|g' docs/index.html
          # Desactivar audio y ume_block para arranque directo
          sed -i 's/data-os=vtx,fs,snd,gui/data-os=vtx,fs,gui/' docs/index.html
          sed -i 's/ume_block : 1/ume_block : 0/' docs/index.html

      - name: Inyectar handler UME para activar pygbag al clic
        run: |
          # pygbag espera window.MM.UME=true — sin este handler el juego nunca arranca
          python3 .github/scripts/inject_ume.py

      - name: Commit y push de /docs actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "deploy: actualizar build web de MATEPONG"
          git push
